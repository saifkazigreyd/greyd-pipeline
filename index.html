function editMember(id){const m=team[id];if(!m)return;
  const rl=ROLES.includes(m.role)?ROLES:ROLES.concat([m.role]);
  $("#tmsheet").innerHTML='<div class="row"><h2 style="margin:0">Edit team member</h2><span class="sp"></span><button data-act="tmclose">Close</button></div><form id="editm" data-id="'+esc(id)+'"><label class="f">Name</label><input name="name" required value="'+esc(m.name)+'"><label class="f">Designation</label><select name="role">'+roleOpts(m.role)+'</select><label class="f">Email</label><input name="email" type="email" value="'+esc(m.email)+'"><label class="f">WhatsApp number</label><input name="wa" value="'+esc(m.wa)+'" placeholder="+8801…"><label class="f">Also called (nicknames used in sheets, comma separated)</label><input name="aka" value="'+esc(m.aka)+'" placeholder="Pooja">'+(me.admin?'<div class="ubox"><b>User login</b><div class="g2"><div><label class="f">User ID</label><input name="login" value="'+esc(m.login)+'" autocomplete="off" placeholder="labib"></div><div><label class="f">'+(m.pw?"New password (blank keeps the current one)":"Password")+'</label><input name="newpw" autocomplete="off" placeholder="'+(m.pw?"unchanged":"at least 6 characters")+'"></div></div><label class="f" style="margin-top:10px">Sections this user can open</label><div class="pchk">'+SECS.map(([k,l])=>'<label><input type="checkbox" name="perm_'+k+'"'+((m.perms||DEFPERM).includes(k)?" checked":"")+'> '+l+'</label>').join("")+'</div><label class="f">Data this user sees</label><select name="scope"><option value="own"'+(m.scope==="all"?"":" selected")+'>Only their own leads, projects and work</option><option value="all"'+(m.scope==="all"?" selected":"")+'>Everything</option></select><label class="f" style="margin-top:10px"><input type="checkbox" name="admin"'+(m.admin?" checked":"")+'> Admin (all sections, all data, assigns leads, manages users)</label>'+(m.pw?'<div style="margin-top:8px"><button type="button" class="sm danger" data-unlink="'+esc(id)+'">Remove login</button></div>':'')+'</div>':'')+'<div class="row" style="margin-top:14px"><span class="sp"></span><button type="button" data-act="tmclose">Cancel</button><button class="pri">Save changes</button></div></form>';
  $("#tm").classList.remove("hidden");
}
$("#tm").addEventListener("click",e=>{if(e.target.id==="tm")$("#tm").classList.add("hidden")});
document.addEventListener("submit",e=>{
  if(e.target.id==="editt"){e.preventDefault();const f=new FormData(e.target),id=e.target.dataset.id,pid=f.get("pid"),k=f.get("key");
    if(!pid||!k)return;const [op,ok]=id?id.split("~"):["",""];
    const tk=(id&&op===pid&&phOf(ok)===k)?ok:freeKey(projects[pid],k);
    const old=id?JSON.parse(JSON.stringify(getP(projects[op],"del."+ok)||{})):{};
    if(id&&!(op===pid&&ok===tk))saveProject(op,p=>{if(p.del)delete p.del[ok]});
    saveProject(pid,p=>{p.del=p.del||{};const d=Object.assign(old,{title:(f.get("title")||"").trim(),a1:f.get("arch")||"",a2:f.get("draft")||"",deadline:f.get("due")||"",status:f.get("status")||"Not started",done:f.get("done")||"",remark:(f.get("remark")||"").trim()});p.del[tk]=d});
    $("#tm").classList.add("hidden");toast("Saved");return}
  if(e.target.id==="editm"){e.preventDefault();const id=e.target.dataset.id,f=new FormData(e.target);
    const m={...team[id],name:f.get("name").trim(),role:f.get("role"),email:f.get("email").trim(),wa:f.get("wa").trim(),aka:(f.get("aka")||"").trim()};
    if(!m.name)return;const np=(f.get("newpw")||"").trim();
    if(me.admin){m.admin=!!f.get("admin");m.login=(f.get("login")||"").trim().toLowerCase();m.perms=SECS.map(x=>x[0]).filter(k=>f.get("perm_"+k));m.scope=f.get("scope")==="all"?"all":"own";
      if(m.login&&Object.entries(team).some(([k,x])=>k!==id&&x.login===m.login)){toast("That user ID is already used");return}
      if(np&&np.length<8){toast("Password needs at least 8 characters");return}
      if(np&&!m.login){toast("Set a user ID first");return}}
    const save=()=>{team[id]=m;$("#tm").classList.add("hidden");render();if(db)db.doc("team/"+id).set(m).then(()=>toast("Saved: "+m.name),err=>toast("Not saved: "+(err&&err.message||"you need edit access")));else toast("Saved on this screen only")};
    delete m.pw;
    if(me.admin&&np){if(m.uid&&team[id]&&team[id].login===m.login){toast("This member already has a login. They can change their password after logging in (Password button). To reset it, delete the user in Supabase, Authentication, Users, then set it here again.");return}
      const tmp=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"gds-tmp"}});
      tmp.auth.signUp({email:toEmail(m.login),password:np}).then(({data,error})=>{if(error){toast(/registered/i.test(error.message)?"That user ID already has a login. Delete it in Supabase, Authentication, Users first.":"Login not created: "+error.message);return}
        if(!data||!data.user||!data.session){toast("Turn off Confirm email in Supabase first (Authentication, Sign In / Providers, Email)");return}
        m.uid=data.user.id;tmp.auth.signOut();save()})}else save();
    return}
  if(e.target.id==="loginf"){e.preventDefault();const f=new FormData(e.target);loginErr="";
    sb.auth.signInWithPassword({email:toEmail(f.get("login")),password:f.get("pw")||""}).then(({error})=>{if(error){loginErr=/invalid/i.test(error.message)?"Wrong ID or password.":error.message;render()}});return}
  if(e.target.id==="setupf"){e.preventDefault();const f=new FormData(e.target);
    sb.auth.signUp({email:String(f.get("email")).trim().toLowerCase(),password:f.get("pw")||""}).then(({data,error})=>{if(error){loginErr=error.message;render();return}if(data&&!data.session){loginErr="Account created but email confirmation is on. Turn off Confirm email in Supabase (Authentication, Sign In / Providers, Email), delete this user there, and try again.";render()}});return}
  if(e.target.id!=="addm")return;e.preventDefault();
  const f=new FormData(e.target),id=uid(),m={name:f.get("name").trim(),role:f.get("role"),email:f.get("email").trim(),wa:f.get("wa").trim(),aka:(f.get("aka")||"").trim()};
  if(!m.name)return;team[id]=m;write("team",id,m);render();toast("Added "+m.name);
});
let dragId=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest("[data-drag]");if(!c)return;dragId=c.dataset.drag;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",dragId)}catch(x){}});
document.addEventListener("dragend",e=>{document.querySelectorAll(".dragging,.over").forEach(x=>x.classList.remove("dragging","over"))});
document.addEventListener("dragover",e=>{const c=e.target.closest&&e.target.closest("[data-drop]");if(!c||!dragId)return;e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x!==c&&x.classList.remove("over"));c.classList.add("over")});
document.addEventListener("drop",e=>{const c=e.target.closest&&e.target.closest("[data-drop]");if(!c||!dragId)return;e.preventDefault();const p=projects[dragId];
  if(p&&p.stage!==c.dataset.drop){p.stage=c.dataset.drop;p.updated=new Date().toISOString();write("projects",dragId,p);toast((p.client||"Project")+" → "+SN[p.stage])}dragId=null;render()});
window.addEventListener("hashchange",render);
init();
setInterval(()=>{if(!document.hidden){autoWorkCheck();autoLeadCheck()}},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){autoWorkCheck();autoLeadCheck()}});
</script>
</body>
</html>
